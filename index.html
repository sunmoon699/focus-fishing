/* 概率面板：抽鱼与展示共用 computeWeights，所见即所得 */
function probCardHtml(){
  const rod = rodById(S.equipped.rod) || RODS[0];
  const bait = baitById(S.equipped.bait);
  const loc = locById(ui.loc);
  const odds = computeWeights(ui.loc, ui.minutes, rod.id, S.equipped.bait);

  let h = '<div class="card" id="probCard"><div class="prob">';
  odds.fishes.forEach((f,i) => {
    const pc = odds.p[i]*100;
    const known = !!S.fish[f.id];
    const boosted = (bait && bait.targets.indexOf(f.id)>=0) || (CFG.rodBonusTier[rod.id] === f.rarity);
    h += '<div class="prob-row'+(boosted?' boost':'')+'">'+
      '<span class="nm" style="color:'+RARITY[f.rarity].color+'">'+(known?esc(f.name):'？？？')+'</span>'+
      '<span class="pbar"><i style="width:'+pc.toFixed(1)+'%;background:'+RARITY[f.rarity].color+'"></i></span>'+
      '<span class="pc">'+(pc<0.05&&pc>0?'<0.1':pc.toFixed(1))+'%</span></div>';
  });
  h += '</div>';

  const eff = [];
  const tier = CFG.rodBonusTier[rod.id];
  if(tier) eff.push('鱼竿「'+rod.name+'」：' + RARITY[tier].name + '档 ×' + (1+CFG.rodBonus).toFixed(2));
  if(bait){
    const here = bait.targets.filter(id => fishById(id).loc === ui.loc);
    /* 此处整段会被 esc 转义成纯文本，故用 coverText（长度有界，不铺开 ？？？长串） */
    if(here.length) eff.push('饵料「'+bait.name+'」：' + coverText(here) + ' 上钩 ×' + bait.bonus);
  }
  if(odds.tb > 0) eff.push('时长加权：传说档 ×' + odds.tm.gold.toFixed(2) + ' · 稀有档 ×' + odds.tm.purple.toFixed(2));
  const mult = sellMult();
  if(mult > 1) eff.push('售价加成 ×' + mult.toFixed(3) + (gearOn('it_reel') ? '（含鱼线轮）' : '') + (tankBonus() > 0 ? '（含水族箱）' : ''));

  h += '<div class="tiny" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">'+
    (eff.length ? eff.map(esc).join('<br>') : '当前无装备加成，专注越久稀有档概率越高')+
    (odds.effective ? '' : '<br><span style="color:var(--danger)">未达最短有效时长 '+S.settings.minEffective+' 分钟，稀有 / 传说档概率为 0</span>')+
  '</div></div>';
  return h;
}

function renderHome(){
  const s = S.session;
  if(s) return renderRunning(s);

  const rod = rodById(S.equipped.rod) || RODS[0];
  const rEnt = rodEntry(rod.id);
  const bait = baitById(S.equipped.bait);
  const tasks = (S.tasks||[]);

  /* 确保当前选中的钓点是已解锁的；若 ui.loc 指向锁定（旧存档）则回落到首个已解锁。
     注意：必须先修正 ui.loc 再取 loc，否则后面用 loc.name 会拿到 null。 */
  if(!isLocOpen(locById(ui.loc))){
    const first = LOCATIONS.find(isLocOpen);
    ui.loc = first ? first.id : null;
  }
  const loc = locById(ui.loc);

  let h = '';

  /* ===== 钓鱼目标：专注任务 + 专注时长 同屏展示（不再切换） ===== */
  h += '<h2 class="sec tbox">钓鱼目标</h2><div class="card">';

  /* --- 专注模式：用户自选 普通 / 严格，决定本次专注的退出规则与结算倍数 --- */
  h += '<div class="sub-cap">专注模式</div>';
  h += '<div class="chips">'+
    '<button class="chip'+(S.settings.focusMode!=='strict'?' on':'')+'" data-mode="normal">普通模式</button>'+
    '<button class="chip'+(S.settings.focusMode==='strict'?' on':'')+'" data-mode="strict">严格模式</button>'+
  '</div>';
  h += '<div class="tbox block" style="font-size:11px;color:var(--muted);margin-top:8px">'+
    (S.settings.focusMode==='strict'
      ? '严格模式：专注期间<b>禁止退出网站</b>（切走页面或关闭窗口＝放弃本次专注，不产出渔获）；完成后渔获价格 <b>翻倍</b> 结算。'
      : '普通模式：保持现有行为，可随时切走或放弃，倒计时按时间戳计算不丢进度。')+
  '</div>';

  /* --- 专注任务 ---
     点任务名填入输入框；点 × 仅从快捷列表删除，不删专注记录。
     输入框 id 必须保持 taskInput —— 事件委托与 startSession 都按这个 id 取值。 */
  h += '<div class="sub-cap">专注任务</div>';
  h += '<input class="txt" id="taskInput" placeholder="这次要做什么？" value="'+esc(ui.task)+'">'+
    (tasks.length ? '<div class="chips" style="margin-top:10px">'+tasks.map(t=>'<button class="chip" data-task="'+esc(t)+'">'+esc(t)+'<span class="del" data-deltask="'+esc(t)+'" title="移除（保留专注记录）">×</span></button>').join('')+'</div>' : '')+
    (tasks.length ? '<div class="tiny tbox block" style="margin-top:8px;color:var(--muted)">点 × 可移除该任务（不会删除对应的专注记录）</div>' : '');

  /* --- 专注时长：与任务同一屏，不再用标签切换 --- */
  h += '<div class="sub-sep"><div class="sub-cap">专注时长（分钟）</div>'+
    '<div class="chips">'+
      S.settings.presets.map(m=>'<button class="chip'+(ui.minutes===m?' on':'')+'" data-min="'+m+'">'+m+'</button>').join('')+
      '<input class="num" id="customMin" type="number" min="1" max="600" style="width:88px" value="'+ui.minutes+'">'+
    '</div>'+
    '<div class="tbox block" style="font-size:11px;color:var(--muted);margin-top:8px">最短有效时长 '+S.settings.minEffective+' 分钟；低于此值只可能钓到常见 / 少见档。改时长会实时改变下面的概率。</div>'+
  '</div>';
  h += '</div>';

  /* ===== 钓鱼准备：钓点（顶部） + 装备（下方）同屏展示（不再切换） ===== */
  h += '<h2 class="sec tbox">钓鱼准备</h2><div class="card">';

  /* --- 钓点：一个占满整行的格子，点击弹出选择面板（与鱼竿 / 饵料同一套交互）---
     只显示「钓点」标签 + 当前已选中的钓点名称，高度与鱼竿格子一致（只有 eq-top 一行）。
     宽度是两列网格里单个格子的两倍 = 整行（.eq-item.tap 本身 width:100%）。 */
  h += '<div class="eq-row">'+
    '<button class="eq-item tap" data-act="pickLoc">'+
      '<div class="eq-top"><span class="ico sm">'+pixIcon('dex')+'</span>'+
        '<div class="eq-txt"><div class="lbl">钓点 <span class="pickhint">点击更换 ›</span></div>'+
        '<div class="val">'+esc(loc.name)+'<span class="loc-tag">'+esc(shortRegion(loc))+'</span></div></div>'+
      '</div>'+
    '</button>'+
  '</div>';
  h += '<div class="tbox block" style="font-size:11px;color:var(--muted);margin-top:8px">已解锁 '+LOCATIONS.filter(isLocOpen).length+' / '+LOCATIONS.length+' 个钓点 · 新钓点去「图鉴」页解锁</div>';

  /* --- 装备：与钓点同屏，直接点鱼竿 / 饵料格子即可更换 --- */
  h += '<div class="sub-sep">';
  h += '<div class="eq-row">'+
      '<button class="eq-item tap" data-act="pickRod">'+
        '<div class="eq-top">'+itemIcon(rod.id, true)+
          '<div class="eq-txt"><div class="lbl">鱼竿 <span class="pickhint">点击更换 ›</span></div>'+
          '<div class="val" style="color:'+RARITY[rod.rarity].color+'">'+rod.name+'</div></div>'+
        '</div>'+
        '<div class="sub">'+rodEff(rod)+'</div>'+
        (rod.dur > 0 && rEnt ? '<div class="bar"><i style="width:'+Math.max(0,rEnt.dur/rod.dur*100)+'%"></i></div>'+
          '<div class="sub">剩余 '+rEnt.dur+' 次</div>'
          : '<div class="sub">永不损耗</div>')+
      '</button>'+
      '<button class="eq-item tap" data-act="pickBait">'+
        '<div class="eq-top">'+itemIcon(bait ? bait.id : 'bait_none', true)+
          '<div class="eq-txt"><div class="lbl">饵料 <span class="pickhint">点击更换 ›</span></div>'+
          '<div class="val">'+(bait?bait.name:'空钩')+'</div></div>'+
        '</div>'+
        '<div class="sub">'+(bait?('指定鱼 ×'+bait.bonus+' · 每次专注消耗 1 份'):'未使用饵料')+'</div>'+
        (bait?'<div class="sub">剩余 '+ownedBait(bait.id)+' 份</div>':
          '<div class="sub">去商店购买</div>')+
      '</button>'+
    '</div>';
    /* 道具开关：原来放在"更换装备"弹窗里，现在直接显示在装备面板上。
       注意：这里必须调用 itemIcon(id, true) 才出图标 —— 之前漏了这一步，
       所以鱼线轮 / 探鱼器两行的图标一直渲染不出来（同级的鱼竿 / 饵料行有调用）。 */
    const gearRow = (id, label, desc) => {
      const own = hasItem(id);
      return '<div class="srow">'+
        '<div class="srow-l">'+itemIcon(id, true)+
          '<div><div class="k">'+label+'</div><div class="d">'+
            (own ? desc + ' · 剩余 ' + itemDur(id) + ' 次' : '未拥有 · 去商店购买') + '</div></div>'+
        '</div>'+
        (own ? '<button class="switch'+(gearOn(id)?' on':'')+'" data-toggle="equipped.'+id+'"><i></i></button>' : '')+'</div>';
    };
    h += '<div style="margin-top:10px;border-top:1px solid var(--line)">'+
      gearRow('it_reel','鱼线轮','渔获售价 +10%')+
      gearRow('it_sonar','探鱼器','结束前最后 1 分钟揭示品质')+
    '</div>';
  h += '</div>';   /* 关闭装备区（.sub-sep） */
  /* 开始专注放在卡片底部 */
  h += '<button class="eq-change" style="margin-top:10px" data-act="start">开始专注</button></div>';

  /* 概率面板 */
  h += '<h2 class="sec tbox">本次上钩概率 · '+esc(loc.name)+'</h2>';
  h += probCardHtml();

  /* 最新记录 */
  if(S.logs.length){
    h += '<h2 class="sec tbox">最新记录</h2><div class="card">'+
      S.logs.slice(0,6).map(l=>{
        const f = l.fish ? fishById(l.fish) : null;
        return '<div class="log-item"><span>'+esc(locById(l.loc).name)+' · '+(l.task||'—')+' · '+l.minutes+' 分钟</span>'+
          '<b>'+(f?'<span style="color:'+RARITY[f.rarity].color+'">'+f.name+'</span> +'+l.price:(l.gave?'放弃了':'—'))+'</b></div>';
      }).join('')+'</div>';
  }
  return h;
}

function renderRunning(s){
  if(s.kind === 'break'){
    return '<div class="card timer-card">'+
      '<div class="ring">'+ring()+'</div>'+
      '<div class="clock"><span id="clockVal">'+fmtMin(elapsedOf(s))+'</span><small>本次已休息 · 目标 '+Math.round(s.plannedMs/60000)+' 分钟</small></div>'+
      '<div class="progress-txt"></div>'+
      '<div class="btn-row"><button class="btn ghost" data-act="pause">'+(s.paused?'继续':'暂停')+'</button>'+
      '<button class="btn danger" data-act="endBreak">结束休息</button></div>'+
      '<div style="font-size:11.5px;color:var(--muted);margin-top:12px">随时可以结束休息，结束后立刻回到首页；休息时间不计入专注统计。</div>'+
    '</div>';
  }
  const loc = locById(s.loc);
  const rod = rodById(s.rodId) || RODS[0];
  const bait = baitById(s.baitId);
  let h = '<div class="card timer-card">';
  /* 严格模式提示：离开网站（切走页面 / 关闭窗口）即视为放弃本次专注 */
  if(s.strict){
    h += '<div class="strict-banner">⚠ 严格模式进行中：专注期间禁止退出网站，切走或关闭窗口将视为放弃本次专注（不产出渔获）</div>';
  }
  /* 专注计时：环正中放像素钓鱼动画（休息页不放） */
  h += '<div class="ring">'+ring()+fishScene()+'</div>';
  h += '<div class="clock"><span id="clockVal">--:--</span><small>'+esc(loc.name)+' · '+(s.task||'专注中')+'</small></div>';
  h += '<div class="progress-txt"></div>';
  h += '<div style="font-size:12px;color:var(--muted);margin-top:10px">'+rod.name+(bait?' · '+bait.name:' · 空钩')+(s.sonar?' · 探鱼器已就绪（最后 1 分钟揭示品质）':'')+'</div>';
  if(s.paused) h += '<div style="font-size:12px;color:var(--muted);margin-top:8px">已暂停（暂停期间不计时）</div>';
  h += (s.sonar ? '<div id="sonarReveal" class="sonar-band" style="display:none;margin-top:12px"></div>' : '');
  h += '<div class="btn-row"><button class="btn ghost" data-act="pause">'+(s.paused?'继续':'暂停')+'</button>'+
       '<button class="btn danger" data-act="giveup">放弃</button></div>';
  h += '<div style="font-size:11px;color:var(--muted);margin-top:12px">'+
    (s.strict
      ? '严格模式下<b>切走页面或关闭窗口＝放弃</b>，请专注到底；完成后渔获价格翻倍结算。'
      : '可切到其他页面或锁屏，倒计时按时间戳计算，不会丢进度。')+
  '</div>';
  h += '</div>';
  return h;
}
/* 像素圆环：36 个小方块围成一圈，代替平滑描边的进度条 */
const RING_SEGS = 36;
function ring(){
  const cx = 100, cy2 = 100, R = 86, s = 9;
  let s2 = '<svg viewBox="0 0 200 200" width="200" height="200">';
  for(let i=0;i<RING_SEGS;i++){
    const a = i/RING_SEGS*Math.PI*2;
    s2 += '<rect class="seg" x="'+(cx+Math.cos(a)*R-s/2).toFixed(1)+'" y="'+(cy2+Math.sin(a)*R-s/2).toFixed(1)+'" width="'+s+'" height="'+s+'"/>';
  }
  return s2 + '</svg>';
}

/* 钓鱼.scene：进度环正中的像素钓鱼小动画
   ------------------------------------------------------------------
   · 画布 32×26 用户单位（渲染成 118×96px），全部由 1~2 单位的方块拼成纯像素造型
   · 分五个可动组，各自独立循环，错开周期避免"整幅齐动"的机械感：
       波纹 .f-rip(2.4s) / 浮标起伏 .f-bob(1.4s) / 咬钩下沉 .f-bite(5s)
       小鱼 .f-fish(5s) / 气泡 .f-bub1·2(3.2s 错相 1.6s)
   · 颜色全部走 CSS 变量，深浅主题自动跟随；动画在 CSS 里用 steps() 做成低帧数
   · 注意：环本体在半径 86 处、时间文字在环外下方，所以这里永远不会压住读数 */
function fishingScene(){
  let s = '<svg viewBox="0 0 32 26" aria-hidden="true">';

  /* ===== 第 1 层：水面以上（白色天空） ===== */
  s += '<rect x="0" y="0" width="32" height="11" fill="var(--surface)"/>';

  /* ===== 第 2 层：水面以下（蓝色水体，画在天空之上以盖住下半部分） ===== */
  s += '<rect x="0" y="11" width="32" height="15" fill="var(--bg2)"/>';
  /* 水面线：一条浅色横带，明确分隔上下两层 */
  s += '<rect x="0" y="11" width="32" height="1" fill="var(--surface)" opacity=".85"/>';

  /* ===== 水下：水草（先画，压在鱼后面） ===== */
  s += '<g class="f-weed" fill="var(--land)">'+
       '<rect x="3" y="17" width="1" height="9"/>'+
       '<rect x="2" y="19" width="3" height="1"/>'+
       '<rect x="4" y="22" width="3" height="1"/>'+
       '<rect x="27" y="19" width="1" height="7"/>'+
       '<rect x="26" y="21" width="3" height="1"/>'+
       '</g>';

  /* ===== 水下：游动的小鱼 ===== */
  s += '<g class="f-fish">'+
       '<rect x="12" y="17" width="5" height="1" fill="var(--green)"/>'+
       '<rect x="11" y="18" width="8" height="2" fill="var(--green)"/>'+
       '<rect x="12" y="20" width="5" height="1" fill="var(--green)"/>'+
       '<rect x="9"  y="16" width="2" height="1" fill="var(--green)"/>'+
       '<rect x="9"  y="21" width="2" height="1" fill="var(--green)"/>'+
       '<rect x="17" y="18" width="1" height="1" fill="var(--surface)"/>'+
       '</g>';

  /* ===== 水面：向外扩散的波纹（左右各两组，错相淡出） ===== */
  const rip = (cls, x) => '<rect class="'+cls+'" x="'+x+'" y="12" width="4" height="1"/>';
  s += '<g fill="var(--surface)" opacity=".9">'+
       rip('f-ripple l', 15) + rip('f-ripple l d1', 17) +
       rip('f-ripple r', 22) + rip('f-ripple r d1', 20) +
       '</g>';

  /* ===== 水面以上：小船（漂在水面上） ===== */
  s += '<g class="f-boat">'+
       /* 船身：上宽下窄的梯形像素 */
       '<rect x="5" y="9"  width="12" height="1" fill="var(--accent)"/>'+
       '<rect x="6" y="10" width="10" height="1" fill="var(--accent)"/>'+
       /* 船篷 */
       '<rect x="8" y="8" width="4" height="1" fill="var(--surface2)"/>'+
       '<rect x="9" y="7" width="2" height="1" fill="var(--surface2)"/>'+
       '</g>';

  /* ===== 船上斜架的鱼竿：由船尾向右上方伸出 ===== */
  s += '<g fill="var(--ink)">'+
       '<rect x="13" y="8" width="1" height="1"/>'+
       '<rect x="14" y="7" width="1" height="1"/>'+
       '<rect x="15" y="7" width="1" height="1"/>'+
       '<rect x="16" y="6" width="1" height="1"/>'+
       '<rect x="17" y="6" width="1" height="1"/>'+
       '<rect x="18" y="5" width="1" height="1"/>'+
       '<rect x="19" y="5" width="1" height="1"/>'+
       '<rect x="20" y="4" width="1" height="1"/>'+
       '</g>';

  /* ===== 鱼线：自竿尖垂直垂到水面的鱼漂 ===== */
  s += '<rect x="20" y="5" width="1" height="5" fill="var(--ink)" opacity=".7"/>';

  /* ===== 水面：鱼漂（红身 + 白环，随波起伏） ===== */
  s += '<g class="f-bob">'+
       '<rect x="20" y="9"  width="1" height="1" fill="var(--danger)"/>'+
       '<rect x="19" y="10" width="3" height="1" fill="var(--danger)"/>'+
       '<rect x="19" y="11" width="3" height="1" fill="var(--surface)"/>'+
       '</g>';

  return s + '</svg>';
}
function fishScene(){
  return '<div class="fish-scene">'+fishingScene()+'</div>';
}

/* ============ 页面：图鉴 ============ */
function renderDex(){
  let h = '<h2 class="sec tbox">世界钓点</h2><div class="map-wrap">'+mapSVG()+'</div>';
  const open = LOCATIONS.filter(isLocOpen);
  const selLoc = ui.dexLoc ? locById(ui.dexLoc) : null;
  const selOpen = selLoc ? isLocOpen(selLoc) : false;
  h += '<div class="card loc-panel"><div class="tbox block" style="font-size:14px;font-weight:600">'+esc(selLoc?selLoc.name:'选择一个钓点')+'</div>'+
    '<div class="tbox block" style="font-size:12px;color:var(--muted);margin-bottom:12px">'+(selLoc?esc(selLoc.region):'点击地图上的光点查看图鉴')+'</div>';
  if(selLoc && !selOpen){
    h += '<div class="empty tbox" style="display:block">该钓点尚未解锁（已解锁 '+open.length+' / '+LOCATIONS.length+'）</div>'+
         '<button class="eq-change" style="margin-top:10px" data-act="unlockDex">使用 1 张通行证解锁「'+esc(selLoc.name)+'」</button>';

    '<div class="tiny tbox block" style="margin-bottom:10px">每陈列一条已解锁的鱼，渔获售价 +0.5%（当前合计 +'+(tankBonus()*100).toFixed(1)+'%，上限 +20%）</div>'+
    '<div class="tank-grid">'+tankSlotsHtml()+'</div>'+
    '<button class="eq-change" style="margin-top:10px" data-act="tank">管理陈列</button>'+
    '</div>';
  return h;
}
function tankSlotsHtml(){
  let h = '';
  for(let i=0;i<S.tankOwn;i++){
    const id = S.tank[i];
    const f = id ? fishById(id) : null;
    if(f && S.fish[f.id]){
      h += '<div class="tank-slot filled" style="border-color:'+RARITY[f.rarity].color+'">'+fishSVG(f,false)+'<span style="color:'+RARITY[f.rarity].color+'">'+esc(f.name)+'</span></div>';
    }else{
      h += '<div class="tank-slot">空槽位</div>';
    }
  }
  const nextCost = TANK_SLOT_COST[S.tankOwn-1];
  if(nextCost) h += '<button class="tank-slot buy" data-buy="tank">+'+(S.tankOwn)+'<span class="tiny">'+nextCost+' 金币</span></button>';
  return h;
}
/* 像素地图：用格子 + 噪声生成抽象陆块（刻意抽象，不画任何真实海岸线 / 国界） */
function mapSVG(){
  const GW = 34, GH = 19, U = 20, W = GW*U, H = GH*U;
  const noise = (x,y) => ((Math.imul(x+7, 73856093) ^ Math.imul(y+13, 19349663)) >>> 0) % 100 / 100;
  const blobs = [
    {cx:7.5,  cy:5.5,  rx:5.4, ry:3.6},
    {cx:16.5, cy:12.5, rx:3.4, ry:4.6},
    {cx:26.5, cy:6.0,  rx:4.6, ry:3.4},
    {cx:27.5, cy:13.8, rx:3.6, ry:2.8},
    {cx:20.5, cy:16.6, rx:2.4, ry:1.5}
  ];
  let s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="抽象世界钓点示意图（像素风）">';
  s += '<rect width="'+W+'" height="'+H+'" fill="var(--surface2)"/>';
  /* 水面像素波纹 */
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){
    if((x + y*3) % 7 === 0) s += '<rect x="'+(x*U)+'" y="'+(y*U)+'" width="'+U+'" height="'+U+'" fill="var(--bg2)"/>';
  }
  /* 陆块 */
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){
    let land = false;
    blobs.forEach(b => {
      const d = Math.pow((x+0.5-b.cx)/b.rx,2) + Math.pow((y+0.5-b.cy)/b.ry,2);
      if(d < 0.86 + noise(x,y)*0.34) land = true;
    });
    if(land) s += '<rect x="'+(x*U)+'" y="'+(y*U)+'" width="'+U+'" height="'+U+'" fill="var(--land)"/>';
  }
  /* 钓点：像素菱形标记 */
  LOCATIONS.forEach(l => {
    const gx = Math.min(GW-1, Math.max(0, Math.round(l.x*GW - 0.5)));
    const gy = Math.min(GH-1, Math.max(0, Math.round(l.y*GH - 0.5)));
    const cx = gx*U + U/2, cy = gy*U + U/2, u = 7;
    const open = isLocOpen(l), sel = ui.dexLoc === l.id;
    const col = open ? 'var(--accent)' : 'var(--muted)';
    const put = (dx,dy) => '<rect x="'+(cx+dx*u-u/2)+'" y="'+(cy+dy*u-u/2)+'" width="'+u+'" height="'+u+'" fill="'+col+'"/>';
    s += '<g data-loc="'+l.id+'" style="cursor:pointer">';
    [[0,-2],[-1,-1],[0,-1],[1,-1],[-2,0],[-1,0],[0,0],[1,0],[2,0],[-1,1],[0,1],[1,1],[0,2]]
      .forEach(p => { s += put(p[0], p[1]); });
    if(sel) s += '<rect x="'+(cx-2.5*u)+'" y="'+(cy-2.5*u)+'" width="'+(6*u)+'" height="'+(6*u)+'" fill="none" stroke="var(--ink)" stroke-width="3"/>';
    s += '</g>';
    if(!open) s += '<text x="'+cx+'" y="'+(cy-2.5*u)+'" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">锁</text>';
    s += '<text x="'+cx+'" y="'+(cy+3.2*u)+'" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)" '+
         'style="paint-order:stroke;stroke:var(--surface);stroke-width:5px">'+l.name+'</text>';
  });
  s += '</svg>';
  return s;
}
function fishGrid(locId){

/* 饵料覆盖鱼种列表：该饵料的 targets 全部鱼种，按稀有度（传说→常见）再按售价降序排列，
   每行显示「鱼名 + 对应钓点」。
   解锁口径：**以图鉴为准**（S.fish 有记录才算已解锁）。未解锁的鱼，
   名称与钓点一律显示为「？？？」，稀有度竖条置灰 —— 与图鉴页锁定卡的呈现一致，
   不通过颜色/文字泄露鱼种与钓点信息。 */
function baitFishRows(b){
  const list = (b.targets || []).map(fishById).filter(Boolean).slice()
    .sort((x, y) => (RARITY_ORDER.indexOf(x.rarity) - RARITY_ORDER.indexOf(y.rarity)) || (y.price - x.price));
  let got = 0;
  const html = list.map(f => {
    const rec = S.fish[f.id], r = RARITY[f.rarity];
    if(rec) got++;
    const loc = locById(f.loc);
    const nm  = rec ? esc(f.name) : '？？？';
    const locTxt = rec ? esc(loc ? loc.name : '未知') : '？？？';
    return '<div class="bf-row'+(rec ? '' : ' locked')+'">'+
      '<i class="bf-bar" style="background:'+(rec ? r.color : 'var(--line)')+'"></i>'+
      fishSVG(f, !rec)+
      '<div class="bf-info">'+
        '<div class="bf-nm"'+(rec ? ' style="color:'+r.color+'"' : '')+'>'+nm+'</div>'+
        '<div class="bf-loc">钓点：'+locTxt+'</div>'+
      '</div></div>';
  }).join('');
  return {total:list.length, got:got, html:html};
}

function buy(key){
  const [kind, id] = key.split(':');
  let obj, price;
  if(kind === 'rod'){ obj = rodById(id); price = obj.price;
    if(hasRod(id)){ toast('已拥有这根鱼竿'); return; } }
  else if(kind === 'bait'){ obj = baitById(id); price = baitPackPrice(id); }
  else if(kind === 'tank'){ price = TANK_SLOT_COST[S.tankOwn-1]; obj = {name:'水族箱槽位', kind:'tank'}; }
  else { obj = itemById(id); price = obj.price;
    if(obj.kind === 'gear' && hasItem(id) && itemDur(id) > 0){ toast('已拥有，等耐久用完再买'); return; }
  }
  if(!price){ toast('已全部解锁'); return; }
  if(S.coins < price){ toast('金币不足，还差 ' + (price - S.coins)); return; }
  S.coins -= price;
  if(kind === 'rod') S.rods.push({id, dur:obj.dur});
  else if(kind === 'bait') S.baits[id] = (S.baits[id]||0) + CFG.baitPack;   // 一包 CFG.baitPack 份
  else if(kind === 'tank'){ S.tankOwn += 1; }
  else {
    if(obj.kind === 'gear'){ S.items[id] = {dur:obj.dur}; S.equipped[id] = true; }
    else if(obj.kind === 'pass'){ S.passes = (S.passes||0) + 1; S.items[id] = {count:(S.items[id] ? S.items[id].count||0 : 0) + 1}; }
    else { S.items[id] = {count:(S.items[id] ? S.items[id].count||0 : 0) + 1}; }
  }
  save(); toast('购买成功：' + obj.name); render();
}

/* ============ 页面：专注统计 ============ */
const RARITY_ORDER = ['gold','purple','blue','green'];
function dayKey(ts){ const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function fmtDur(min){
  min = Math.max(0, Math.round(min||0));
  const h = Math.floor(min/60), m = min%60;
  return h ? (h+' 小时 '+(m?m+' 分':'0 分')) : (m+' 分钟');
}
function statCollect(){
  const done = S.logs.filter(l => l.fish);
  const byDay = {};
  done.forEach(l => { const k = dayKey(l.t); byDay[k] = (byDay[k]||0) + (l.minutes||0); });

  /* 连续天数：今天有记录就从今天数，否则从昨天数 */
  let cur = dayKey(Date.now());
  if(!byDay[cur]) cur -= 86400000;
  let streak = 0;
  while(byDay[cur]){ streak++; cur -= 86400000; }

  const today = dayKey(Date.now());
  const week = [];
  for(let i=6;i>=0;i--){
    const k = today - i*86400000;
    week.push({k:k, lab:['日','一','二','三','四','五','六'][new Date(k).getDay()], min:byDay[k]||0});
  }

  const byRarity = {}, byLoc = {}, byTask = {};
  done.forEach(l => {
    const f = fishById(l.fish); if(!f) return;
    byRarity[f.rarity] = (byRarity[f.rarity]||0) + 1;
    byLoc[f.loc]       = (byLoc[f.loc]||0) + 1;
  });
  /* 按事项（专注任务名）汇总累计专注时长：只统计成功完成的专注，
     与页面"放弃的专注不计入"的口径一致；未填写任务的归入「未命名」。 */
  done.forEach(l => {
    const k = (l.task || '').trim() || '未命名';
    if(!byTask[k]) byTask[k] = {min:0, n:0};
    byTask[k].min += (l.minutes || 0);
    byTask[k].n   += 1;
  });
  let totalFish = 0;
  Object.keys(S.fish).forEach(id => { totalFish += (S.fish[id] && S.fish[id].count) || 0; });

  const maxWeek = week.reduce((a,w) => Math.max(a, w.min), 0);
  return {
    week:week, maxWeek:maxWeek, weekMin: week.reduce((a,w)=>a+w.min,0),
    streak:streak, byRarity:byRarity, byLoc:byLoc, byTask:byTask, totalFish:totalFish,
    totalMin:S.totalMinutes, totalCount:S.totalSessions,
    coins: done.reduce((a,b) => a + (b.price||0), 0),
    logCount: S.logs.length
  };
}
function statCell(v, k){
  return '<div class="st-cell"><b>'+v+'</b><span>'+k+'</span></div>';
}
function statChart(week, maxW){
  return '<div class="chart-row">'+week.map(w => {
    const h = w.min ? Math.max(8, Math.round(w.min / maxW * 96)) : 3;
    return '<div class="bar-col'+(w.min?'':' zero')+'">'+
      '<div class="bar-stack"><i style="height:'+h+'px;background-color:var(--accent)"></i></div>'+
      '<div class="bar-lab">'+w.lab+'</div></div>';
  }).join('')+'</div>';
}
/* unit 默认「条」（渔获计数场景）；按事项统计时传「分钟」。
   cls 用于给不同的图例换宽度（.wide 给较长的中文事项名）。 */
function statLegend(rows, unit, cls){
  const max = rows.reduce((a,r) => Math.max(a, r.v), 0) || 1;
  return '<div class="legend'+(cls ? ' '+cls : '')+'">'+rows.map(r =>
    '<div class="legend-row"><div class="legend-k">'+esc(r.k)+'</div>'+
    '<div class="legend-bar"><i style="width:'+(r.v ? Math.max(4, r.v/max*100) : 0)+'%;background-color:'+r.color+'"></i></div>'+
    '<div class="legend-v">'+r.v+' '+(unit||'条')+'</div></div>').join('')+'</div>';
}
function statEmpty(ico, t, d){
  return '<div class="empty-box"><div class="eb-ico">'+ico+'</div>'+
    '<div class="eb-t">'+t+'</div><div class="eb-d">'+d+'</div></div>';
}
/* 加载骨架屏：先占位，聚合完成后替换，避免聚合期间页面空白 */
function statSkeleton(){
  return '<div class="card"><div class="bar-cap">概览</div>'+
    '<div class="st-grid">'+Array(6).fill('<div class="skel" style="height:64px"></div>').join('')+'</div>'+
    '<div class="skel" style="height:18px;margin-top:10px"></div></div>'+
    '<div class="card" style="margin-top:12px"><div class="skel" style="height:170px"></div></div>'+
    '<div class="card" style="margin-top:12px"><div class="skel" style="height:120px"></div></div>'+
    '<div class="card" style="margin-top:12px"><div class="skel" style="height:120px"></div></div>';
}
function statBody(){
  const st = statCollect();
  const openLoc = LOCATIONS.filter(isLocOpen).length;
  const tl = todayLogs();
  /* 今日专注只统计成功完成的专注；放弃的专注（l.fish 为空，gave:true）不计入（与累计口径一致） */
  const tlDone     = tl.filter(l => l.fish);
  const todayMin   = tlDone.reduce((a,b)=>a+(b.minutes||0),0);
  const todayFish  = tlDone.length;
  const todayCoins = tlDone.reduce((a,b)=>a+(b.price||0),0);
  let h = '';
  /* 概览：累计指标 + 图鉴收集 + 钓点解锁数量（图鉴与钓点按需求从「今日数据」迁入概览） */
  h += '<div class="card"><div class="bar-cap">概览</div>'+
    '<div class="st-grid">'+
      statCell(fmtDur(st.totalMin), '累计专注时长') +
      statCell(st.totalCount, '完成次数') +
      statCell(st.totalFish, '累计渔获（条）') +
      statCell(st.streak+' 天', '连续专注') +
      statCell(Object.keys(S.fish).length+' / '+FISH.length, '图鉴收集') +
      statCell(openLoc+' / '+LOCATIONS.length, '已解锁钓点') +
    '</div>'+
    '<div class="detail" style="margin-top:10px">'+
      '<div><span>累计金币收益</span><span>'+st.coins+'</span></div>'+
      '<div><span>近 7 天专注</span><span>'+fmtDur(st.weekMin)+'</span></div>'+
      '<div><span>保存的记录条数</span><span>'+st.logCount+' / 最多 200</span></div>'+
    '</div></div>';

  /* 今日数据：仅含「今日渔获数量 / 获得金币数量 / 专注时长」三项 */
  h += '<div class="card" style="margin-top:12px"><div class="bar-cap">今日数据</div>'+
    '<div class="st-grid">'+
      statCell(todayFish, '今日渔获（条）') +
      statCell(todayCoins, '今日金币（枚）') +
      statCell(todayMin, '今日专注（分钟）') +
    '</div></div>';

  h += '<div class="card" style="margin-top:12px"><div class="bar-cap">近 7 天专注时长</div>'+
    (st.weekMin
      ? statChart(st.week, st.maxWeek)+
        '<div class="tiny tbox block" style="margin-top:8px">单位：分钟 · 峰值 '+st.maxWeek+' 分钟 · 放弃的专注不计入</div>'
      : statEmpty('📊','最近 7 天还没有记录','完成一次专注后，这里会按天画出柱状图'))+
    '</div>';

  h += '<div class="card" style="margin-top:12px"><div class="bar-cap">渔获珍稀度分布</div>'+
    (st.totalFish
      ? statLegend(RARITY_ORDER.map(k => ({k:RARITY[k].name, v:st.byRarity[k]||0, color:RARITY[k].color})))
      : statEmpty('🐟','还没有钓到鱼','图鉴解锁后这里会统计各珍稀度的数量'))+
    '</div>';

  const locKeys = Object.keys(st.byLoc);
  h += '<div class="card" style="margin-top:12px"><div class="bar-cap">各钓点渔获</div>'+
    (locKeys.length
      ? statLegend(locKeys.sort((a,b)=>st.byLoc[b]-st.byLoc[a]).map(id => ({k:locById(id).name, v:st.byLoc[id], color:'var(--accent2)'})))
      : statEmpty('🗺','还没有钓点记录','去不同水域钓鱼后，这里会比较各钓点的收获'))+
    '</div>';

  /* 按事项分类：把每条记录的专注任务名聚合成"事项 → 累计分钟数"，按时长倒序 */
  const taskKeys = Object.keys(st.byTask).sort((a,b) => st.byTask[b].min - st.byTask[a].min || st.byTask[b].n - st.byTask[a].n);
  h += '<div class="card" style="margin-top:12px"><div class="bar-cap">按事项分类的专注时长</div>'+
    (taskKeys.length
      ? statLegend(taskKeys.map(k => ({k:k, v:st.byTask[k].min, color:'var(--green)'})), '分钟', 'wide')+
        '<div class="detail" style="margin-top:10px">'+
          '<div><span>事项数量</span><span>'+taskKeys.length+' 类</span></div>'+
          '<div><span>合计专注时长</span><span>'+fmtDur(taskKeys.reduce((a,k)=>a+st.byTask[k].min,0))+'</span></div>'+
        '</div>'+
        '<div class="tiny tbox block" style="margin-top:8px">按首页「专注任务」名称归类，累计已完成的专注分钟数；未填写任务的记入「未命名」，放弃的专注不计入。</div>'
      : statEmpty('🗂','还没有分事项的数据','在首页填写「这次要做什么」并完成一次专注后，这里会按事项汇总时长'))+
    '</div>';
  return h;
}
/* ============ 页面：钓友（联机前置） ============ */
/* 钓友与通知数据来自服务端，仅登录态可用；ff 为前端内存缓存（Q14：进入 tab 时拉取一次） */
const ff = {
  list: [], loaded: false, loading: false, loadErr: false,
  notif: { in: [], out: [], notices: [], unread: 0 }
};
function friendCloud(){ return auth.mode === 'cloud' && !!auth.token; }
function friendValidName(u){ return typeof u === 'string' && /^[A-Za-z0-9_\u4e00-\u9fa5]{2,16}$/.test(u); }

/* 拉取钓友列表 + 通知；无论成败都置 loaded，避免失败时空转无限重拉 */
async function friendLoad(){
  if(!friendCloud() || ff.loading) return;
  ff.loading = true;
  let err = false;
  try{
    const r = await api('friend/list');
    if(r && r.ok && r.data) ff.list = (r.data.friends || []).slice();
    else err = true;
    const n = await api('notifications');
    if(n && n.ok && n.data) ff.notif = {
      in: n.data.requests_in || [], out: n.data.requests_out || [],
      notices: n.data.notices || [], unread: n.data.unread || 0
    };
    else err = true;
  }catch(e){ err = true; }
  ff.loading = false;
  ff.loaded = true;
  ff.loadErr = err;
  if(page === 'friends') render();
}
function renderFriends(){
  /* 未登录：提示去登录（钓友依赖云端账号） */

    if(ff.loadErr){
      h += '<div class="fr-empty"><div class="fr-empty-t">加载失败</div>'+

      h += '<div class="fr-loading">加载中…</div>';
      if(!ff.loading) friendLoad();   /* 进入 tab 时拉取一次（Q14） */
    }
    return h;
  }
  if(!ff.list.length){
    h += '<div class="fr-empty">'+
      '<div class="fr-empty-t">还没有认识钓友，快去添加吧~</div>'+

      '<div class="fr-av">'+avatarSVG(f.avatar)+'</div>'+

      '<div class="fr-today">今日 '+td.focusMin+' 分钟</div>'+

/* —— 添加好友 —— */
function openFriendAdd(){
  const html =
    '<h3>添加钓友</h3>'+
    '<div class="sub">输入对方登录名（用户名）发送申请</div>'+
    '<input class="txt" id="frSearchInput" placeholder="对方登录名" maxlength="16" autocomplete="off">'+
    '<div class="fr-search-res" id="frSearchRes"></div>'+
    '<div class="fr-add-actions">'+
      '<button class="btn ghost" data-act="close">取消</button>'+
      '<button class="btn" id="frSendBtn" style="display:none" data-act="frSend">发送申请</button>'+
    '</div>';
  openModal(html, frAddOnAct);
  const inp = $('frSearchInput');
  if(inp){ inp.addEventListener('input', frSearchInput); setTimeout(function(){ inp.focus(); }, 0); }
}
async function frSearchInput(e){
  const u = (e.target.value || '').trim();
  const res = $('frSearchRes'), send = $('frSendBtn');
  if(!res) return;
  if(!friendValidName(u)){ res.innerHTML = ''; if(send) send.style.display = 'none'; return; }
  res.innerHTML = '<div class="tiny">搜索中…</div>';
  if(send) send.style.display = 'none';
  try{
    const r = await api('friend/search', { method:'POST', body:{ username:u } });
    if(!r || !r.ok){ res.innerHTML = '<div class="tiny err">'+(r && r.msg ? esc(r.msg) : '搜索失败')+'</div>'; return; }
    const d = r.data;
    if(!d.found){ res.innerHTML = '<div class="tiny err">未找到该用户</div>'; return; }
    if(d.self){ res.innerHTML = '<div class="tiny">这是你自己的账号</div>'; return; }
    if(d.relation === 'friend'){ res.innerHTML = '<div class="tiny">已经是好友啦</div>'; return; }
    if(d.relation === 'pending_out'){ res.innerHTML = '<div class="tiny">申请已发出，等待对方通过</div>'; return; }
    if(d.relation === 'pending_in'){
      res.innerHTML = '<div class="tiny">对方已向你发送申请</div>'+
        '<button class="btn sm" data-act="frAcceptIn" data-un="'+esc(d.username)+'" style="margin-top:8px">通过申请</button>';
      return;
    }
    res.innerHTML = '<div class="fr-found">'+
      '<div class="fr-found-nm">'+esc(d.name || d.username)+'</div>'+
      '<div class="fr-found-un">@'+esc(d.username)+'</div></div>';
    if(send){ send.style.display = ''; send.dataset.un = d.username; }
  }catch(err){ res.innerHTML = '<div class="tiny err">网络错误</div>'; }
}
async function frAddOnAct(a, btn){
  if(a === 'frSend'){
    const u = btn.dataset.un; if(!u) return true;
    btn.disabled = true;
    try{
      const r = await api('friend/request', { method:'POST', body:{ username:u } });
      if(!r || !r.ok){ toast(r && r.msg ? r.msg : '发送失败'); btn.disabled = false; return true; }
      toast('已发送好友申请'); closeModal(); friendLoad();
    }catch(e){ toast('网络错误'); btn.disabled = false; }
    return true;
  }
  if(a === 'frAcceptIn'){
    const u = btn.dataset.un; if(!u) return true;
    try{
      const r = await api('friend/accept', { method:'POST', body:{ username:u } });
      if(!r || !r.ok){ toast(r && r.msg ? r.msg : '操作失败'); return true; }
      toast('已通过申请，成为钓友'); closeModal(); friendLoad();
    }catch(e){ toast('网络错误'); }
    return true;
  }
  return false;
}

/* ===================================================================
   道具图标：统一 12×12 像素点阵 + 自动描边
   所有鱼竿 / 饵料 / 道具走同一套"画形状 → 自动补描边 → 转 SVG"流程，
   因此风格与尺寸完全一致；没有配置图形的道具会落到 placeholder。
   调色板字符： k=描边  #=主色  o=暗部  ~=亮部  l=鱼线  e=留白（眼白）
   =================================================================== */
const ICON_N = 12;
function iGrid(){ const g = []; for(let i=0;i<ICON_N;i++) g.push(new Array(ICON_N).fill('.')); return g; }
function iPx(g,x,y,c){ x = Math.round(x); y = Math.round(y); if(x>=0 && x<ICON_N && y>=0 && y<ICON_N) g[y][x] = c; }
function iRect(g,x,y,w,h,c){ for(let j=0;j<h;j++) for(let i=0;i<w;i++) iPx(g,x+i,y+j,c); }
function iEll(g,cx,cy,rx,ry,c){
  for(let y=0;y<ICON_N;y++) for(let x=0;x<ICON_N;x++){
    const dx = (x-cx)/(rx||.5), dy = (y-cy)/(ry||.5);
    if(dx*dx + dy*dy <= 1.08) iPx(g,x,y,c);
  }
}
function iDia(g,cx,cy,r,c){
  for(let y=0;y<ICON_N;y++) for(let x=0;x<ICON_N;x++){
    if(Math.abs(x-cx) + Math.abs(y-cy) <= r) iPx(g,x,y,c);
  }
}
/* 自动描边：紧挨实心格的空格补一圈 'k'，保证所有图标都有统一的深色轮廓 */
function iOutline(g){
  const o = g.map(r => r.slice());
  for(let y=0;y<ICON_N;y++) for(let x=0;x<ICON_N;x++){
    if(g[y][x] !== '.') continue;
    const near = (x>0 && g[y][x-1] !== '.') || (x<ICON_N-1 && g[y][x+1] !== '.') ||
                 (y>0 && g[y-1][x] !== '.') || (y<ICON_N-1 && g[y+1][x] !== '.');
    if(near) o[y][x] = 'k';
  }
  return o;
}
function rowsOf(g){ return g.map(r => r.join('')); }
/* 行数组 → SVG，同色连续格子合并成一个 rect，保持像素感 */
function pixRowsSVG(rows, pal){
  let s = '<svg viewBox="0 0 12 12" aria-hidden="true">';
  rows.forEach((r,y) => {
    let x = 0;
    while(x < ICON_N){
      const c = r.charAt(x);
      if(c !== '.' && pal[c]){
        let n = 1; while(x+n < ICON_N && r.charAt(x+n) === c) n++;
        s += '<rect x="'+x+'" y="'+y+'" width="'+n+'" height="1" fill="'+pal[c]+'"/>';
        x += n;
      } else x++;
    }
  });
  return s + '</svg>';
}

/* 鱼竿：共用同一支竿的剪影，用宝石大小区分珍稀度，保证"同风格、可比较" */
function rodIcon(tier, gem){
  const g = iGrid();
  for(let y=0;y<=10;y++){ const x = 10-y; iPx(g,x,y,'#'); iPx(g,x+1,y,'#'); }
  for(let x=0;x<3;x++) for(let y=9;y<=11;y++) iPx(g,x,y,'o');   // 握把
  for(let x=3;x<=5;x++) for(let y=7;y<=9;y++) iPx(g,x,y,'o');   // 卷线器
  iPx(g,11,1,'l'); iPx(g,11,2,'l'); iPx(g,11,3,'l');            // 鱼线
  iPx(g,10,3,'l'); iPx(g,9,3,'l'); iPx(g,9,4,'l'); iPx(g,9,5,'l'); iPx(g,8,5,'l');
  if(tier > 0){
    for(let dy=-tier;dy<=tier;dy++) for(let dx=-tier;dx<=tier;dx++)
      if(Math.abs(dx) + Math.abs(dy) <= tier) iPx(g,8+dx, 8+dy, '~');
  }
  return {rows: rowsOf(iOutline(g)), pal:{
    k:'var(--ink)', '#':'#8a5a2b', o:'#4a3a63', l:'#cfeaf7', '~':gem
  }};
}

/* ============ 事件 ============ */
document.addEventListener('click', e => {
  const t = e.target;

  /* 账号管理下拉：点击落在下拉容器外时收起（容器含按钮与菜单） */
  if(!t.closest('.acct-menu-wrap')){
    document.querySelectorAll('.acct-menu').forEach(function(m){ if(m.style.display !== 'none') m.style.display = 'none'; });
  }

  const tabBtn = t.closest('[data-page]');
  if(tabBtn){ page = tabBtn.dataset.page; ui.editingName=false; render(); return; }
  const avatarChip = t.closest('[data-avatar]');
  if(avatarChip){ openAvatarEditor(); return; }

  const shopBtn = t.closest('[data-shop]');
  if(shopBtn){ page = 'shop'; ui.editingName = false; render(); return; }

  const shopTabBtn = t.closest('[data-tab]');
  if(shopTabBtn){ shopTab = shopTabBtn.dataset.tab; render(); return; }

  const locBtn = t.closest('[data-loc]');
  if(locBtn){
    const id = locBtn.dataset.loc, l = locById(id);
    if(!l) return;
    if(page === 'dex'){
      /* 图鉴页允许点锁定钓点：持通行证则消耗 1 张自选解锁。
         解锁是弹层异步确认的，所以用回调设置选中项（确认后或已解锁时都会执行） */
      tryUnlock(id, function(){ ui.dexLoc = id; render(); });
      return;
    }
    /* 首页只渲染已解锁钓点，直接切换即可 */
    ui.loc = id;
    render(); return;
  }

  const minBtn = t.closest('[data-min]');
  if(minBtn){ ui.minutes = +minBtn.dataset.min; render(); return; }

  /* 专注模式（普通 / 严格）：写入 settings.focusMode 并即时刷新 */
  const modeBtn = t.closest('[data-mode]');
  if(modeBtn){
    S.settings.focusMode = (modeBtn.dataset.mode === 'strict') ? 'strict' : 'normal';
    save(); render(); return;
  }

  const delTaskBtn = t.closest('[data-deltask]');
  if(delTaskBtn){ delTask(delTaskBtn.dataset.deltask); return; }

  const taskBtn = t.closest('[data-task]');
  if(taskBtn){ ui.task = taskBtn.dataset.task; render(); return; }

  const buyBtn = t.closest('[data-buy]');
  if(buyBtn){ buy(buyBtn.dataset.buy); return; }

  /* 饵料卡整卡可点 → 查看覆盖鱼种。必须放在 data-buy 之后，
     否则点「购买」也会被当成查看详情（购买按钮是卡片的后代节点）。 */
  const baitInfo = t.closest('[data-baitinfo]');
  if(baitInfo){ openBaitInfo(baitInfo.dataset.baitinfo); return; }

  /* 图鉴：点击已解锁的鱼类条目 → 现实百科弹窗。
     锁定条目（.fish.locked）在 fishGrid 里不带 data-fish，closest 返回 null，
     因此不触发任何反应或弹窗——与需求「两种状态点击行为区分明确」一致。 */
  const fishCard = t.closest('[data-fish]');
  if(fishCard){ openFishWiki(fishCard.dataset.fish); return; }

  const nameRow = t.closest('[data-name]');
  if(nameRow){ if(ui.editingName) return; ui.editingName = true; render(); setTimeout(()=>{ const i=$('nameInput'); if(i){ i.focus(); i.select(); } }, 0); return; }

  const swBtn = t.closest('[data-toggle]');
  if(swBtn){
    const path = swBtn.dataset.toggle;
    if(path === 'theme'){ S.settings.theme = S.settings.theme==='dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = S.settings.theme; }
    else if(path.indexOf('equipped.') === 0){
      const key = path.split('.')[1];
      if(!hasItem(key)){ toast('还没买这件道具'); return; }
      S.equipped[key] = !S.equipped[key];
    }
    else S.settings[path] = !S.settings[path];
    save(); render(); return;
  }

  /* 时长预设：删除（至少保留 1 个） */
  const presetDel = t.closest('[data-preset-del]');
  if(presetDel){ removePreset(+presetDel.dataset.presetDel); return; }

  const act = t.closest('[data-act]');
  if(act){
    const a = act.dataset.act;
    if(a === 'start'){ const ti = $('taskInput'); if(ti) ui.task = ti.value; const ci = $('customMin'); if(ci && +ci.value > 0) ui.minutes = +ci.value; startSession(); }
    else if(a === 'pause') pauseToggle();
    else if(a === 'giveup') giveUp();
    else if(a === 'endBreak') endBreak();
    else if(a === 'pickRod') pickRod();
    else if(a === 'pickBait') pickBait();
    else if(a === 'pickLoc') pickLoc();
    else if(a === 'tank') openTank();
    else if(a === 'unlockDex'){ if(ui.dexLoc) tryUnlock(ui.dexLoc); }
    else if(a === 'useOil') openOil();
    else if(a === 'presetAdd') addPreset();
    else if(a === 'export') exportData();
    else if(a === 'import') $('fileInput').click();
    else if(a === 'clear'){
      /* iOS 上 file:// 打开时原生 confirm 常被拦截，改用自绘确认框 */
      confirmBox('清空全部数据', '图鉴、金币、装备、记录都会重置，且无法恢复。', '确认清空', resetAll);
    }
    else if(a === 'saveName'){ const i=$('nameInput'); const v=(i?i.value:'').trim(); if(v){ S.profile.name = v.slice(0,12); save(); } ui.editingName=false; render(); }
    else if(a === 'cancelName'){ ui.editingName=false; render(); }
    else if(a === 'logout') doLogout();
    else if(a === 'acctMenu'){ const m = $('acctMenu'); if(m) m.style.display = (m.style.display === 'none' ? '' : 'none'); }
    else if(a === 'delAcct') deleteAccount();
    else if(a === 'goAuth'){ auth.mode = 'offline'; showAuth('login'); }
    else if(a === 'frAdd') openFriendAdd();
    else if(a === 'frNotif') openFriendNotifs();
    else if(a === 'frManage') openFriendManage();
    else if(a === 'frOpen') openFriendDetail(act.dataset.un);
    else if(a === 'frRetry'){ ff.loaded = false; ff.loadErr = false; friendLoad(); }
    return;
  }
});

  const old = document.querySelector('#probCard');
  const holder = document.createElement('div');
  holder.innerHTML = '<div id="probCard">' + probCardHtml() + '</div>';

/* ============ 时长预设（设置页增删） ============ */
function addPreset(){
  const el = $('presetNew'); if(!el) return;
  const v = Math.round(+el.value);
  if(!isFinite(v) || v < 1 || v > 600){ toast('请输入 1–600 之间的分钟数'); return; }
  if(S.settings.presets.indexOf(v) >= 0){ toast('该时长已在预设里'); return; }
  if(S.settings.presets.length >= 8){ toast('预设最多 8 个，先删掉一个'); return; }
  S.settings.presets = S.settings.presets.concat(v).sort((a,b)=>a-b);
  ui.minutes = v;                       // 新增后首页直接选中它
  save(); render(); toast('已添加 '+v+' 分钟');
}
function removePreset(m){
  if(!m || isNaN(m)) return;
  if(S.settings.presets.length <= 1){ toast('至少保留一个时长预设'); return; }
  S.settings.presets = S.settings.presets.filter(v => v !== m);
  if(ui.minutes === m) ui.minutes = S.settings.presets[0];
  save(); render(); toast('已删除 '+m+' 分钟');
}

/* ============================================================
   合并导入：保留本机全部已有数据，只把"库里没有"的记录补进来
   ------------------------------------------------------------
   判重依据（各集合的唯一标识）：
     fish     → fishId              logs   → t|loc（同时刻同钓点算同一次）
     rods     → id                  baits  → baitId
     items    → itemId              tank   → fishId（元素值）
     unlocked → locId               tasks  → 任务名本身
   规则：
     · 库中已存在 → 跳过，且不更新它的任何字段，计入 skip
     · 库中不存在 → 新增，计入 added
     · 导入文件内部重复 → 同样只保留第一条，计入 skip
   数据一致性：全程在 S 的深拷贝上合并，全部成功后才整体替换并落盘；
             中途抛错不会留下"写了一半"的状态。
   标量处理：金币 / 累计时长 / 完成次数 / 通行证不是"记录"、没有唯一标识可判重，
             在记录层面已完成去重的前提下直接**累加**；
             陈列槽位 tankOwn 是容量上限（非数量），累加会虚增，故取较大值；
             settings 与 equipped 保持本机不变（不覆盖已有偏好）。
   ============================================================ */
function normalizeImport(d){
  const o = Object.assign({}, d || {});
  /* 旧存档的通行证是 {mariana:bool}，先归一成"整数 + unlocked 映射"再参与合并 */
  if(typeof o.passes !== 'number'){
    o.unlocked = Object.assign({}, o.unlocked || {});
    if(o.passes && o.passes.mariana) o.unlocked.mariana = true;
    o.passes = 0;
  }
  return o;
}

function mergeImport(d){
  const src  = normalizeImport(d);
  /* 副本：任一步出错都不会污染真实存档 */
  const T    = JSON.parse(JSON.stringify(S));
  const stat = {read:0, added:0, skip:0, byType:{}};
  /* bump：累加总数并同时记下该类型的明细，便于核对 */
  const bump = (type, kind) => {
    stat[kind]++;
    const b = stat.byType[type] || (stat.byType[type] = {added:0, skip:0});
    b[kind]++;
  };
  /* seen：只用于"单次导入文件内部"的去重，不同集合用前缀区分避免撞键 */
  const seen = Object.create(null);

  /* --- 图鉴：主键 fishId --- */
  Object.keys(src.fish || {}).forEach(id => {
    stat.read++;
    if(!fishById(id)) return;                          // 未知鱼种：忽略，不计入新增/跳过
    if(seen['f:'+id]){ bump('图鉴','skip'); return; }  // 文件内部重复
    seen['f:'+id] = 1;
    if(T.fish[id]){ bump('图鉴','skip'); return; }     // 库中已有 → 原样保留，不改任何字段
    T.fish[id] = src.fish[id]; bump('图鉴','added');
  });

  /* --- 专注记录：业务唯一键 t|loc（先把已有键建索引，避免逐条线性查找） --- */
  const logKey = x => String(x && x.t) + '|' + ((x && x.loc) || '');
  const hasLog = Object.create(null);
  T.logs.forEach(x => { hasLog[logKey(x)] = 1; });
  (src.logs || []).forEach(l => {
    if(!l) return;
    stat.read++;
    const k = logKey(l);
    if(seen['l:'+k]){ bump('专注记录','skip'); return; }
    seen['l:'+k] = 1;
    if(hasLog[k]){ bump('专注记录','skip'); return; }
    hasLog[k] = 1; T.logs.push(l); bump('专注记录','added');
  });

  /* --- 鱼竿：主键 id --- */
  const hasRodId = Object.create(null);
  T.rods.forEach(r => { if(r && r.id) hasRodId[r.id] = 1; });
  (src.rods || []).forEach(r => {
    if(!r || !r.id) return;
    stat.read++;
    if(seen['r:'+r.id]){ bump('鱼竿','skip'); return; }
    seen['r:'+r.id] = 1;
    if(hasRodId[r.id]){ bump('鱼竿','skip'); return; }  // 已有该竿：保留原有的耐久，不覆盖
    hasRodId[r.id] = 1; T.rods.push(r); bump('鱼竿','added');
  });

  /* --- 饵料：主键 baitId（值是份数，已存在则保持原份数） --- */
  Object.keys(src.baits || {}).forEach(id => {
    stat.read++;
    if(seen['b:'+id]){ bump('饵料','skip'); return; }
    seen['b:'+id] = 1;
    if(T.baits[id] !== undefined){ bump('饵料','skip'); return; }
    T.baits[id] = src.baits[id]; bump('饵料','added');
  });

  /* --- 道具：主键 itemId --- */
  Object.keys(src.items || {}).forEach(id => {
    stat.read++;
    if(seen['i:'+id]){ bump('道具','skip'); return; }
    seen['i:'+id] = 1;
    if(T.items[id]){ bump('道具','skip'); return; }
    T.items[id] = src.items[id]; bump('道具','added');
  });

  /* --- 水族箱陈列：元素即 fishId；受已购槽位限制，满了就跳过 --- */
  (src.tank || []).forEach(id => {
    stat.read++;
    if(seen['k:'+id]){ bump('陈列','skip'); return; }
    seen['k:'+id] = 1;
    if(T.tank.indexOf(id) >= 0 || T.tank.length >= T.tankOwn){ bump('陈列','skip'); return; }
    T.tank.push(id); bump('陈列','added');
  });

  /* --- 已解锁钓点：主键 locId --- */
  Object.keys(src.unlocked || {}).forEach(id => {
    stat.read++;
    if(seen['u:'+id]){ bump('钓点','skip'); return; }
    seen['u:'+id] = 1;
    if(!locById(id)) return;                            // 无效钓点：忽略
    if(T.unlocked[id]){ bump('钓点','skip'); return; }
    T.unlocked[id] = true; bump('钓点','added');
  });

  /* --- 历史任务名：字符串本身即唯一标识 --- */
  (src.tasks || []).forEach(t => {
    if(!t) return;
    stat.read++;
    if(seen['t:'+t]){ bump('任务','skip'); return; }
    seen['t:'+t] = 1;
    if(T.tasks.indexOf(t) >= 0){ bump('任务','skip'); return; }
    T.tasks.push(t); bump('任务','added');
  });

  /* --- 标量：累加合并 ---
     这些是余额 / 累计数，不是"有身份的记录"，判重规则套不上。
     记录层面已按唯一标识去重，剩下的都是真实新增，因此直接相加：
     coins（余额）、totalMinutes（累计专注分钟）、totalSessions（完成次数）、
     passes（剩余通行证张数）全部累加。 */
  T.coins         = (+T.coins         || 0) + (+src.coins         || 0);
  T.totalMinutes  = (+T.totalMinutes  || 0) + (+src.totalMinutes  || 0);
  T.totalSessions = (+T.totalSessions || 0) + (+src.totalSessions || 0);
  T.passes        = (+T.passes        || 0) + (+src.passes        || 0);
  /* tankOwn 例外：它是「已购陈列槽位的容量上限」而不是数量
     （TANK_SLOT_COST 只有 3 档）。两边各自买到 3 槽时累加会虚增成 6，
     且槽位价格表会越界，因此这里取较大值。 */
  T.tankOwn       = Math.max(+T.tankOwn || 1, +src.tankOwn || 1);
  /* settings / equipped：保持 T（本机）原值，不覆盖 */

  return {draft:T, stat:stat};
}

/* 导入结果统计面板：把三项总数与分类型明细都列出来，便于核对 */
function showImportStat(stat){
  const row = (k, v) => '<div><span>'+k+'</span><span>'+v+'</span></div>';
  let detail = row('读取总条数', stat.read) + row('成功新增', stat.added) + row('略过重复', stat.skip);
  Object.keys(stat.byType).forEach(t => {
    const b = stat.byType[t];
    if(b.added || b.skip) detail += row(t + '（新增/略过）', b.added + ' / ' + b.skip);
  });
  openModal('<h3>合并导入完成</h3>'+
    '<div class="sub">已按唯一标识逐条比对：本机原有数据全部保留，重复的已跳过。</div>'+
    '<div class="detail">'+detail+'</div>'+
    '<div class="btn-row"><button class="btn" data-act="close">知道了</button></div>');
  /* 同时打到控制台，方便在电脑上核对完整对象 */
  try{ console.log('[合并导入]', stat); }catch(e){}
}

/* 隐藏的文件输入 */
const fi = document.createElement('input');
fi.type = 'file'; fi.id = 'fileInput'; fi.accept = 'application/json'; fi.style.display = 'none';
document.body.appendChild(fi);
fi.addEventListener('change', () => {
  const f = fi.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      if(!d || typeof d !== 'object') throw new Error('bad');
      /* 合并导入：先在副本上完成全部比对，成功后再整体替换 + 落盘，
         所以任何一步失败都不会留下"写了一半"的状态。 */
      const r = mergeImport(d);
      S = r.draft;
      document.documentElement.dataset.theme = S.settings.theme || 'light';
      save(); render();
      toast('合并导入完成 · 新增 ' + r.stat.added + ' 条，略过 ' + r.stat.skip + ' 条');
      showImportStat(r.stat);
    }catch(e){ toast('文件格式不对或已损坏'); }
  };
  rd.readAsText(f);
  fi.value = '';
});

/* 恢复未完成的专注 */
function restore(){
  const s = S.session;
  if(!s) return;
  if(s.kind === 'focus' && s.resultId){
    // 页面关闭期间倒计时已走完 → 直接结算
    if(!s.paused && Date.now() >= s.endAt){ finish(); }
  } else if(Date.now() >= s.endAt){ finish(); }
}

/* ============ 严格模式：退出网站＝放弃本次专注 ============
   普通模式：可切走页面 / 锁屏，倒计时按时间戳计算，不会丢进度（原行为）。
   严格模式：专注期间禁止退出网站；一旦页面被隐藏（切走标签 / 最小化 / 关闭窗口）
   或触发卸载，即视为放弃本次专注（数据层静默处理，复用 abandonSession）。
   beforeunload 仅用于弹出浏览器的「离开此页？」二次确认，劝阻退出；
   真正落地的放弃由 visibilitychange / pagehide 的 strictGuardLeave 执行，
   这样即使用户在确认框里点「留下」也不会误删会话，只有确实离开才放弃。 */
function activeStrictFocus(){
  return !!(S.session && S.session.kind === 'focus' && S.session.strict);
}
function strictGuardLeave(){ if(activeStrictFocus()) abandonSession(); }
window.addEventListener('beforeunload', function(e){
  if(activeStrictFocus()){
    e.preventDefault();
    e.returnValue = '严格模式进行中，离开将放弃本次专注。';
  }
});
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden') strictGuardLeave();
});
window.addEventListener('pagehide', strictGuardLeave);

/* ============ 账号 / 云存档（登录 · 注册） ============
   后端是 Cloudflare Pages Functions（functions/api/[[path]].js）+ D1。
   密码只在服务端以 PBKDF2 加盐哈希存储，前端只负责把明文密码 POST 过去
   （走 HTTPS），本地不缓存密码。
   后端未配置或网络不通时自动降级为「离线模式」，本机照常能玩。 */
const AUTH_KEY = 'focus_fishing_auth_v1';
const auth = { token:'', username:'', mode:'offline' };   /* mode: 'cloud' | 'offline' */
let authTab = 'login', syncTimer = null, userCheckTimer = null;
const USERNAME_RE = /^[A-Za-z0-9_\u4e00-\u9fa5]{2,16}$/;

function apiUrl(p){ return '/api/' + p; }
async function api(path, opt){
  opt = opt || {};
  const init = { method: opt.method || 'GET', headers: {} };
  if(opt.body){ init.headers['content-type'] = 'application/json'; init.body = JSON.stringify(opt.body); }
  if(auth.token) init.headers['authorization'] = 'Bearer ' + auth.token;
  try{
    const r = await fetch(apiUrl(path), init);
    let j = null;
    try{ j = await r.json(); }catch(e){ j = null; }
    return { ok: !!(j && j.ok), status: r.status, data: j || { msg:'服务器返回异常' } };
  }catch(e){
    return { ok:false, status:0, data:{ msg:'无法连接服务器' } };
  }
}

function restoreAuth(){
  try{
    const raw = localStorage.getItem(AUTH_KEY);
    if(raw){ const o = JSON.parse(raw); auth.token = o.token || ''; auth.username = o.username || ''; }
  }catch(e){}
}
function persistAuth(){
  try{ localStorage.setItem(AUTH_KEY, JSON.stringify({ token:auth.token, username:auth.username })); }catch(e){}
}
function clearAuth(){
  auth.token = ''; auth.username = '';
  try{ localStorage.removeItem(AUTH_KEY); }catch(e){}
}

/* ---- 进度判断与比对：决定「本机存档 / 云端存档」该留哪份 ----
   注意：全新存档自带 50 金币，所以不能简单用「金币 > 0」判断有进度，
   否则每个新用户都会被误判成「本机有进度」从而弹出冲突选择框。
   正确做法是和「全新存档」逐项比对，只要有任一项偏离初始值就算有进度。 */
function hasProgress(s){
  if(!s || typeof s !== 'object') return false;
  const base = DEFAULT();
  const dex   = s.fish  ? Object.keys(s.fish).length  : 0;
  const baits = s.baits ? Object.keys(s.baits).length : 0;
  const items = s.items ? Object.keys(s.items).length : 0;
  const rods  = Array.isArray(s.rods) ? s.rods.length : 0;
  const unlk  = s.unlocked ? Object.keys(s.unlocked).length : 0;
  const logs  = Array.isArray(s.logs) ? s.logs.length : 0;
  /* 字段缺失时按初始值算，避免把残缺对象误判成「有进度」 */
  const coins = (s.coins === undefined || s.coins === null) ? base.coins : (s.coins|0);
  return coins !== base.coins                       /* 赚过或花过都算 */
      || dex > 0 || logs > 0 || baits > 0 || items > 0 || unlk > 0
      || rods > base.rods.length
      || (s.totalSessions|0) > 0 || (s.totalMinutes|0) > 0
      || (s.passes|0) > 0 || (s.tankOwn|0) > base.tankOwn;
}
function progressKey(s){
  return JSON.stringify({
    c: s.coins|0, s: s.totalSessions|0, m: s.totalMinutes|0,
    d: s.fish ? Object.keys(s.fish).sort() : [],
    l: Array.isArray(s.logs) ? s.logs.length : 0,
    r: Array.isArray(s.rods) ? s.rods.length : 0,
    p: s.passes|0
  });
}
function sameProgress(a, b){ return progressKey(a) === progressKey(b); }

/* ---- 云端同步：本地每次写盘都会触发一次防抖上传 ---- */
function syncCloud(){
  if(!auth.token) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushSave, 700);
}
function pushSave(){
  if(!auth.token) return;
  api('save', { method:'PUT', body:{ data:S } }).then(function(r){
    if(r.status === 401) toast('登录已失效，请重新登录');
  });
}

/* ---- 登录 / 注册界面 ---- */
function setAuthMsg(text, loading){
  const el = $('authMsg'); if(!el) return;
  el.textContent = text || '';
  el.className = 'auth-msg' + (loading ? ' loading' : '');
}
function inputVal(id){ const el = $(id); return el ? (el.value || '') : ''; }

function showAuthLoading(text){
  const el = $('authRoot'); if(!el) return;
  el.style.display = 'flex';
  el.innerHTML = '<div class="auth-card"><div class="auth-brand">专注钓鱼</div>'+
    '<div class="auth-sub">'+esc(text || '正在同步云端存档…')+'</div></div>';
}
function renderAuth(){
  const isLogin = authTab !== 'register';
  const head = '<div class="auth-brand">专注钓鱼</div>'+
    '<div class="auth-sub">登录后存档与账号绑定，换设备也能继续</div>'+
    '<div class="auth-tabs">'+
      '<button class="auth-tab'+(isLogin?' on':'')+'" data-authtab="login">登录</button>'+
      '<button class="auth-tab'+(isLogin?'':' on')+'" data-authtab="register">注册</button>'+
    '</div>';
  const body = isLogin
    ? '<label class="auth-field"><span>用户名</span>'+
        '<input id="lgUser" class="auth-input" autocomplete="username" placeholder="请输入用户名"></label>'+
      '<label class="auth-field"><span>密码</span>'+
        '<input id="lgPass" class="auth-input" type="password" autocomplete="current-password" placeholder="请输入密码"></label>'+
      '<div class="auth-msg" id="authMsg"></div>'+
      '<button class="auth-btn" id="authLoginBtn">登录</button>'
    : '<label class="auth-field"><span>用户名</span>'+
        '<input id="rgUser" class="auth-input" autocomplete="username" placeholder="2–16 位字母 / 数字 / 下划线 / 汉字">'+
        '<div class="auth-tip" id="rgUserTip"></div></label>'+
      '<label class="auth-field"><span>密码</span>'+
        '<input id="rgPass" class="auth-input" type="password" autocomplete="new-password" placeholder="至少 6 位"></label>'+
      '<label class="auth-field"><span>确认密码</span>'+
        '<input id="rgPass2" class="auth-input" type="password" autocomplete="new-password" placeholder="再输入一次密码"></label>'+
      '<div class="auth-msg" id="authMsg"></div>'+
      '<button class="auth-btn" id="authRegBtn">注册并登录</button>';
  const foot = '<div class="auth-foot">'+
      '<button class="auth-link" id="authOfflineBtn">离线游玩（不登录）</button>'+
      '<div class="auth-note" id="authNote"></div>'+
    '</div>';
  return '<div class="auth-card">' + head + body + foot + '</div>';
}
function showAuth(tab){
  authTab = tab || authTab || 'login';
  const el = $('authRoot'); if(!el) return;
  el.style.display = 'flex';
  el.innerHTML = renderAuth();
  bindAuth();
  /* 探测后端是否就绪，未就绪时明确告知可离线游玩 */
  api('ping').then(function(r){
    const note = $('authNote'); if(!note) return;
    note.textContent = r.ok ? '数据保存在云端，换设备登录即可继续。'
                            : '当前无法连接服务器，注册与登录暂不可用，可先离线游玩。';
  });
}
function bindAuth(){
  const root = $('authRoot'); if(!root) return;
  const tabs = root.querySelectorAll ? root.querySelectorAll('[data-authtab]') : [];
  for(let i=0;i<tabs.length;i++){
    tabs[i].addEventListener('click', function(){
      authTab = this.getAttribute('data-authtab');
      showAuth(authTab);
    });
  }
  const lb = $('authLoginBtn');  if(lb) lb.addEventListener('click', doLogin);
  const rb = $('authRegBtn');    if(rb) rb.addEventListener('click', doRegister);
  const ob = $('authOfflineBtn');if(ob) ob.addEventListener('click', function(){ auth.mode = 'offline'; enterGame(); });
  const ru = $('rgUser');        if(ru) ru.addEventListener('input', scheduleUserCheck);
  const inputs = root.querySelectorAll ? root.querySelectorAll('.auth-input') : [];
  for(let i=0;i<inputs.length;i++){
    inputs[i].addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ if(authTab === 'register') doRegister(); else doLogin(); }
    });
  }
}
function doLogin(){
  const u = inputVal('lgUser').trim(), p = inputVal('lgPass');
  if(!u || !p){ setAuthMsg('请输入用户名和密码'); return; }
  setAuthMsg('正在登录…', true);
  /* 返回 Promise，方便调用方（与测试）等待结果 */
  return api('login', { method:'POST', body:{ username:u, password:p } }).then(function(r){
    if(!r.ok){ setAuthMsg(r.data.msg || '登录失败'); return r; }
    auth.token = r.data.token; auth.username = r.data.username; auth.mode = 'cloud';
    persistAuth();
    afterAuth(r.data.save, false);
    return r;
  });
}
function doRegister(){
  const u = inputVal('rgUser').trim(), p = inputVal('rgPass'), p2 = inputVal('rgPass2');
  if(!u){ setAuthMsg('请输入用户名'); return; }
  if(!USERNAME_RE.test(u)){ setAuthMsg('用户名需为 2–16 位字母、数字、下划线或汉字'); return; }
  if(p.length < 6){ setAuthMsg('密码至少 6 位'); return; }
  if(p !== p2){ setAuthMsg('两次输入的密码不一致'); return; }
  setAuthMsg('正在注册…', true);
  /* 返回 Promise，方便调用方（与测试）等待结果 */
  return api('register', { method:'POST', body:{ username:u, password:p, confirmPassword:p2 } }).then(function(r){
    if(!r.ok){ setAuthMsg(r.data.msg || '注册失败'); return r; }
    auth.token = r.data.token; auth.username = r.data.username; auth.mode = 'cloud';
    persistAuth();
    afterAuth(null, true);
    return r;
  });
}
/* 注册页实时提示用户名是否重复 */
function scheduleUserCheck(){
  const tip = $('rgUserTip'); if(!tip) return;
  const u = inputVal('rgUser').trim();
  clearTimeout(userCheckTimer);
  if(!u){ tip.textContent = ''; tip.className = 'auth-tip'; return; }
  if(!USERNAME_RE.test(u)){
    tip.textContent = '需 2–16 位字母、数字、下划线或汉字';
    tip.className = 'auth-tip bad'; return;
  }
  tip.textContent = '检查中…'; tip.className = 'auth-tip';
  userCheckTimer = setTimeout(function(){
    api('check', { method:'POST', body:{ username:u } }).then(function(r){
      const t = $('rgUserTip'); if(!t) return;
      if(typeof r.data.available !== 'boolean'){
        t.textContent = r.data.msg || '无法检查用户名'; t.className = 'auth-tip bad'; return;
      }
      if(r.data.available){ t.textContent = '✓ 该用户名可以使用'; t.className = 'auth-tip good'; }
      else { t.textContent = '✗ 该用户名已被注册'; t.className = 'auth-tip bad'; }
    });
  }, 450);
}

/* ---- 登录后：决定用哪份存档 ---- */
function afterAuth(cloudSave, isRegister){
  const localHas = hasProgress(S), cloudHas = hasProgress(cloudSave);
  if(isRegister){
    /* 新账号：直接采用本机当前状态作为初始存档（昵称默认取用户名） */
    S.profile.name = auth.username.slice(0, 12);
    save(); enterGame(); return;
  }
  if(!localHas){ adoptCloud(cloudSave); enterGame(); return; }   /* 本机没进度 → 用云端 */
  if(!cloudHas){ save(); enterGame(); return; }                  /* 云端没进度 → 用本机并上传 */
  if(sameProgress(S, cloudSave)){ enterGame(); return; }         /* 两边一致 → 直接用 */
  showConflict(S, cloudSave);                                    /* 都有且不同 → 让用户选 */
}
function adoptCloud(d){
  migrate(d || {});
  document.documentElement.dataset.theme = (S.settings && S.settings.theme) || 'light';
  save();
}
function cvSummary(s){
  const dex = s.fish ? Object.keys(s.fish).length : 0;
  return '<div class="cv-item">'+
    '<span class="cv-k">金币</span><span class="cv-v">'+(s.coins|0)+'</span>'+
    '<span class="cv-k">图鉴</span><span class="cv-v">'+dex+' 种</span>'+
    '<span class="cv-k">专注</span><span class="cv-v">'+(s.totalSessions|0)+' 次</span>'+
    '<span class="cv-k">时长</span><span class="cv-v">'+(s.totalMinutes|0)+' 分</span>'+
  '</div>';
}
function showConflict(localS, cloudS){
  openModal(
    '<h3>存档冲突</h3>'+
    '<div class="sub">本机与云端都有进度，请选择保留哪一份（另一份会被覆盖）</div>'+
    '<div class="cv-wrap">'+
      '<div class="cv-col"><div class="cv-t">本机存档</div>'+cvSummary(localS)+'</div>'+
      '<div class="cv-col"><div class="cv-t">云端存档</div>'+cvSummary(cloudS)+'</div>'+
    '</div>'+
    '<div class="btn-row"><button class="btn ghost" data-act="useLocal">用本机</button>'+
    '<button class="btn" data-act="useCloud">用云端</button></div>',
    function(a){
      if(a === 'useLocal'){ closeModal(); S = localS; save(); enterGame(); return true; }
      if(a === 'useCloud'){ closeModal(); adoptCloud(cloudS); enterGame(); return true; }
    }
  );
}
function enterGame(){
  const el = $('authRoot'); if(el) el.style.display = 'none';
  document.documentElement.dataset.theme = (S.settings && S.settings.theme) || 'light';
  render();
  if(auth.mode === 'cloud') syncCloud();
}
function doLogout(){
  const m = $('acctMenu'); if(m) m.style.display = 'none';   /* 收起账号管理下拉 */
  confirmBox('退出登录', '退出后将回到登录界面，当前进度已保存在云端。', '退出登录', function(){
    api('logout', { method:'POST' });
    clearAuth();
    auth.mode = 'offline';
    S = DEFAULT();          /* 清空本机数据，避免和下一个账号串档 */
    save();
    showAuth('login');
  });
}
/* 注销账号：二次强警告后删除云端账号与全部数据，并清本机 */
function deleteAccount(){
  const m = $('acctMenu'); if(m) m.style.display = 'none';   /* 收起账号管理下拉 */
  confirmBox('注销账号',
    '此操作将永久删除你的账号，以及云端存档、好友关系、今日与历史统计等全部数据，且无法恢复；你在其他钓友的列表中也会消失。确定要注销吗？',
    '注销账号', function(){
      const btn = document.querySelector('.acct-item.danger');
      if(btn) btn.disabled = true;
      api('account/delete', { method:'POST' }).then(function(r){
        if(!r || !r.ok){ toast(r && r.msg ? r.msg : '注销失败，请重试'); if(btn) btn.disabled = false; return; }
        clearAuth(); auth.mode = 'offline'; S = DEFAULT(); save(); showAuth('login');
        toast('账号已注销');
      }).catch(function(){ toast('网络错误，注销失败'); if(btn) btn.disabled = false; });
    });
}
/* 启动入口：有会话先同步云端存档，没有则先显示登录界面 */
function boot(){
  if(auth.token){
    showAuthLoading('正在同步云端存档…');
    api('save', { method:'GET' }).then(function(r){
      if(r.status === 401){ clearAuth(); auth.mode = 'offline'; showAuth('login'); return; }
      if(!r.ok){ auth.mode = 'offline'; enterGame(); return; }   /* 网络不通 → 离线继续 */
      auth.mode = 'cloud';
      auth.username = r.data.username || auth.username;
      persistAuth();
      afterAuth(r.data.save, false);
    });
  }else{
    showAuth('login');
  }
}

/* 启动 */
load();
restoreAuth();
/* 支持 #dex / #shop / #set 直接落到某一页，并在 hash 变化时跟随 */
const HASH_PAGES = {home:1, dex:1, shop:1, stat:1, set:1};
function pageFromHash(){
  const h = (location.hash || '').replace('#','');
  if(HASH_PAGES[h]) page = h;
}
window.addEventListener('hashchange', () => { pageFromHash(); render(); });
ui.dexLoc = 'changjiang';
restore();
pageFromHash();
boot();          /* 未登录先显示登录/注册界面，已登录则同步云端存档后进入游戏 */
</script>
</body>
